plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

// Read version properties
def versionPropsFile = file("${rootDir}/version.properties")
def versionMajor = 1
def versionMinor = 1
def versionPatch = 0
def versionBuild = 1

if (versionPropsFile.canRead()) {
    Properties versionProps = new Properties()
    versionProps.load(new FileInputStream(versionPropsFile))
    versionMajor = versionProps['VERSION_MAJOR'].toInteger()
    versionMinor = versionProps['VERSION_MINOR'].toInteger()
    versionPatch = versionProps['VERSION_PATCH'].toInteger()
    versionBuild = versionProps['VERSION_BUILD'].toInteger()
}

// Compute dynamic versionCode and versionName
def computedVersionCode = (System.getenv("GITHUB_RUN_NUMBER") != null) ?
        (versionMajor * 10000 + versionMinor * 100 + System.getenv("GITHUB_RUN_NUMBER").toInteger()) :
        (versionMajor * 10000 + versionMinor * 100 + versionPatch * 10 + versionBuild)

def computedVersionName = "${versionMajor}.${versionMinor}.${versionPatch}"

android {
    namespace 'com.smartmess.android'
    compileSdk 34

    defaultConfig {
        applicationId "com.smartmess.android"
        minSdk 19
        targetSdk 34
        versionCode computedVersionCode
        versionName computedVersionName
        multiDexEnabled true
        vectorDrawables.useSupportLibrary = true

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // Custom output APK naming with App Name and Version
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def appName = "SmartMess"
            def vName = variant.versionName
            def bType = variant.buildType.name
            outputFileName = "${appName}-v${vName}-${bType}.apk"
        }
    }
}

// Tasks to bump app version automatically
tasks.register('bumpPatch') {
    doLast {
        def propsFile = file("${rootDir}/version.properties")
        if (propsFile.canRead()) {
            Properties props = new Properties()
            props.load(new FileInputStream(propsFile))
            int patch = props['VERSION_PATCH'].toInteger() + 1
            int build = props['VERSION_BUILD'].toInteger() + 1
            props['VERSION_PATCH'] = patch.toString()
            props['VERSION_BUILD'] = build.toString()
            props.store(propsFile.newWriter(), null)
            println "SmartMess Version updated to: ${props['VERSION_MAJOR']}.${props['VERSION_MINOR']}.${patch}"
        }
    }
}

tasks.register('bumpMinor') {
    doLast {
        def propsFile = file("${rootDir}/version.properties")
        if (propsFile.canRead()) {
            Properties props = new Properties()
            props.load(new FileInputStream(propsFile))
            int minor = props['VERSION_MINOR'].toInteger() + 1
            int build = props['VERSION_BUILD'].toInteger() + 1
            props['VERSION_MINOR'] = minor.toString()
            props['VERSION_PATCH'] = "0"
            props['VERSION_BUILD'] = build.toString()
            props.store(propsFile.newWriter(), null)
            println "SmartMess Version updated to: ${props['VERSION_MAJOR']}.${minor}.0"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.work:work-runtime:2.9.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    
    // Network & Serialization
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    
    // Security ProviderInstaller for Android 6.0.1 / legacy TLS modern root CAs
    implementation 'com.google.android.gms:play-services-base:18.0.1'
    
    // Image Loading
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    // QR Code Generation
    implementation 'com.google.zxing:core:3.5.3'

    // Firebase Cloud Messaging
    implementation platform('com.google.firebase:firebase-bom:33.1.0')
    implementation 'com.google.firebase:firebase-messaging'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
